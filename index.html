<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .game-container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 350px;
      width: 90%;
    }

    h1 {
      color: #333;
    }

    .buttons {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }

    button {
      font-size: 18px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background-color: #4A90E2;
      color: white;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .results {
      margin-top: 20px;
      font-size: 18px;
    }

    #winner-text {
      color: #2e7d32;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="game-container">
  <h1>Rock, Paper, Scissors</h1>
  <p>Choose your move:</p>
  
  <div class="buttons">
    <button onclick="playGame('🪨')">🪨 Rock</button>
    <button onclick="playGame('📄')">📄 Paper</button>
    <button onclick="playGame('✂️')">✂️ Scissors</button>
  </div>

  <div class="results">
    <p id="player-choice">Your choice: -</p>
    <p id="computer-choice">Computer's choice: -</p>
    <h2 id="winner-text">Make a move to start!</h2>
  </div>
</div>

<script>
function playGame(playerChoice) {
  const choices = ['🪨', '📄', '✂️'];
  const computerChoice = choices[Math.floor(Math.random() * 3)];

  document.getElementById('player-choice').textContent = 'Your choice: ' + playerChoice;
  document.getElementById('computer-choice').textContent = "Computer's choice: " + computerChoice;

  let result = '';

  if (playerChoice === computerChoice) {
    result = "It's a tie! 🤝";
  } else if (
    (playerChoice === '🪨' && computerChoice === '✂️') ||
    (playerChoice === '📄' && computerChoice === '🪨') ||
    (playerChoice === '✂️' && computerChoice === '📄')
  ) {
    result = 'You win! 🎉';
  } else {
    result = 'Computer wins! 🤖';
  }

  document.getElementById('winner-text').textContent = result;
}
</script>

</body>
</html>
